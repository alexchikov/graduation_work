name: CD

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: prod

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Deploy project files
        run: |
          cd /home/airflow
          cp ${{ github.workspace }}/pyproject.toml /home/airflow/
          cp -r ${{ github.workspace }}/dags /home/airflow/s/

      - name: Install dependencies
        run: |
          cd /home/airflow
          /home/airflow/.local/bin/poetry lock
          /home/airflow/.local/bin/poetry install --no-root

      - name: Restart Airflow
        run: |
          sudo -n /usr/bin/systemctl restart airflow-webserver
          sudo -n /usr/bin/systemctl restart airflow-scheduler
